# Requires the ANTHROPIC_API_KEY repo secret to be set (Settings -> Secrets and
# variables -> Actions -> New repository secret) for this workflow to function.
name: Archie PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  archie-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: aidanc667/archie@main
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
